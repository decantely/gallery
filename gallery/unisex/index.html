<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }
    img.thumb {
      width: 300px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    img.thumb:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">
</head>
<body>

  <!-- Thumbnails -->
  <div id="gallery"></div>

  <script type="module">
    import PhotoSwipeLightbox from "https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js";
    import PhotoSwipe from "https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js";

    // List of image filenames (1.png, 2.png, etc.)
    const imageCount = 7; // adjust to your number of images
    const galleryDiv = document.getElementById("gallery");

    for (let i = 1; i <= imageCount; i++) {
      const thumb = document.createElement("a");
      thumb.href = `photos/${i}.png`;
      thumb.dataset.pswpWidth = 1600;  // approximate full image width
      thumb.dataset.pswpHeight = 1200; // approximate full image height
      thumb.dataset.pswpSrc = `photos/${i}.png`;
      thumb.innerHTML = `<img src="photos/${i}.png" class="thumb" loading="lazy">`;
      galleryDiv.appendChild(thumb);
    }

    const lightbox = new PhotoSwipeLightbox({
      gallery: "#gallery",
      children: "a",
      pswpModule: PhotoSwipe,
      showHideAnimationType: 'fade',
      zoom: true,
      bgOpacity: 1,
    });
    lightbox.init();
  </script>

</body>
</html>
